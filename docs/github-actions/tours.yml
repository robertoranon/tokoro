# Copy to .github/workflows/tours.yml in the private data repo.
name: Band tours

on:
  schedule:
    - cron: "0 10 * * 3" # Wednesdays 10:00 UTC
  workflow_dispatch:

concurrency:
  group: tours
  cancel-in-progress: false

jobs:
  tours:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout private data repo
        uses: actions/checkout@v4
        with:
          path: data

      - name: Checkout tokoro (public)
        uses: actions/checkout@v4
        with:
          repository: robertoranon/tokoro
          path: tokoro

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            tokoro/crawler/package-lock.json
            tokoro/shared/package-lock.json

      - name: Install dependencies
        run: |
          npm ci --prefix tokoro/shared
          npm ci --prefix tokoro/crawler

      - name: Install Playwright Chromium
        working-directory: tokoro/crawler
        run: npx playwright install --with-deps chromium

      - name: Run tours
        working-directory: tokoro/crawler
        env:
          TOKORO_API_URL: ${{ secrets.TOKORO_API_URL }}
          CRAWLER_PRIVKEY: ${{ secrets.CRAWLER_PRIVKEY }}
          CRAWLER_PUBKEY: ${{ secrets.CRAWLER_PUBKEY }}
          LLM_PROVIDER: ${{ vars.LLM_PROVIDER }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          OPENROUTER_MODEL: ${{ vars.OPENROUTER_MODEL }}
          JINA_API_KEY: ${{ secrets.JINA_API_KEY }}
          BRAVE_SEARCH_API_KEY: ${{ secrets.BRAVE_SEARCH_API_KEY }}
        run: npm run tours -- --bands "$GITHUB_WORKSPACE/data/bands.yaml"
