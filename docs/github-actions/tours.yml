# Copy to .github/workflows/tours.yml in the private data repo.
name: Band tours

# bands.yaml is split in three parts by a stable hash of each source url
# (`--part N/3`), one part per run: Monday, Wednesday and Friday.
on:
  schedule:
    - cron: "0 12 * * 1" # Mondays 12:00 UTC    -> part 1/3
    - cron: "0 12 * * 3" # Wednesdays 12:00 UTC -> part 2/3
    - cron: "0 12 * * 5" # Fridays 12:00 UTC    -> part 3/3
  workflow_dispatch:
    inputs:
      part:
        description: "Which part of bands.yaml to run"
        type: choice
        options: ["1/3", "2/3", "3/3", "all"]
        default: "1/3"
      retry_failed:
        description: "Only re-run the sources that failed in the last tours run (ignores 'part')"
        type: boolean
        default: false

concurrency:
  group: tours
  cancel-in-progress: false

permissions:
  contents: write # commit logs/runs.jsonl back

jobs:
  tours:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout private data repo
        uses: actions/checkout@v4
        with:
          path: data

      - name: Checkout tokoro (public)
        uses: actions/checkout@v4
        with:
          repository: robertoranon/tokoro
          path: tokoro

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            tokoro/crawler/package-lock.json
            tokoro/shared/package-lock.json

      - name: Install dependencies
        run: |
          npm ci --prefix tokoro/shared
          npm ci --prefix tokoro/crawler

      - name: Install Playwright Chromium
        working-directory: tokoro/crawler
        run: npx playwright install --with-deps chromium

      # The run log (staleness report, --retry-failed) lives in the private repo.
      - name: Restore run log
        run: |
          mkdir -p tokoro/crawler/logs
          if [ -f data/logs/runs.jsonl ]; then
            cp data/logs/runs.jsonl tokoro/crawler/logs/runs.jsonl
          fi

      - name: Run tours
        working-directory: tokoro/crawler
        env:
          TOKORO_API_URL: ${{ secrets.TOKORO_API_URL }}
          CRAWLER_PRIVKEY: ${{ secrets.CRAWLER_PRIVKEY }}
          CRAWLER_PUBKEY: ${{ secrets.CRAWLER_PUBKEY }}
          LLM_PROVIDER: ${{ vars.LLM_PROVIDER }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          OPENROUTER_MODEL: ${{ vars.OPENROUTER_MODEL }}
          JINA_API_KEY: ${{ secrets.JINA_API_KEY }}
          BRAVE_SEARCH_API_KEY: ${{ secrets.BRAVE_SEARCH_API_KEY }}
          EVENT_SCHEDULE: ${{ github.event.schedule }}
          INPUT_PART: ${{ inputs.part }}
          INPUT_RETRY: ${{ inputs.retry_failed }}
        run: |
          case "$EVENT_SCHEDULE" in
            "0 12 * * 1") PART=1/3 ;;
            "0 12 * * 3") PART=2/3 ;;
            "0 12 * * 5") PART=3/3 ;;
            *) PART="$INPUT_PART" ;; # manual run
          esac
          ARGS=(--bands "$GITHUB_WORKSPACE/data/bands.yaml")
          if [ "$INPUT_RETRY" = "true" ]; then
            ARGS+=(--retry-failed)
          elif [ "$PART" != "all" ]; then
            ARGS+=(--part "$PART")
          fi
          npm run tours -- "${ARGS[@]}"

      - name: Save run log
        if: always()
        run: |
          [ -f tokoro/crawler/logs/runs.jsonl ] || exit 0
          mkdir -p data/logs
          cp tokoro/crawler/logs/runs.jsonl data/logs/runs.jsonl
          cd data
          git config user.name "tokoro-tours[bot]"
          git config user.email "actions@users.noreply.github.com"
          git add logs/runs.jsonl
          git diff --cached --quiet || git commit -m "chore: tours run log $(date -u +%F)"
          git pull --rebase
          git push
