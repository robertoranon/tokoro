<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Tokoro Tours – bands on the road</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,800..900&family=Poppins:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
      integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY="
      crossorigin=""
    />
    <style>
      *,
      *::before,
      *::after {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }
      [hidden] {
        display: none !important;
      }
      body {
        font-family:
          'Poppins',
          -apple-system,
          BlinkMacSystemFont,
          'Segoe UI',
          sans-serif;
        background: var(--bg);
        color: var(--text);
        min-height: 100vh;
      }
      a {
        color: var(--link);
      }

      /* ── Header ─────────────────────────────────────────────────────── */
      .site-header {
        background: linear-gradient(
          135deg,
          var(--header-dark) 0%,
          var(--bg) 50%,
          var(--bg) 100%
        );
        color: white;
        position: relative;
        overflow: hidden;
      }
      .header-inner {
        max-width: 960px;
        margin: 0 auto;
        padding: 28px 24px 24px;
        position: relative;
      }
      .header-title {
        font-family: 'Fraunces', serif;
        font-size: clamp(2.2rem, 6vw, 3.4rem);
        font-weight: 800;
        line-height: 1.05;
        letter-spacing: -0.02em;
      }
      .header-title em {
        font-style: italic;
        color: var(--accent-2);
      }
      .header-sub {
        font-size: 15px;
        color: rgba(255, 255, 255, 0.6);
        margin-top: 10px;
        font-weight: 300;
        max-width: 560px;
      }
      .experimental-badge {
        position: absolute;
        top: 16px;
        right: 24px;
        background: rgba(255, 255, 255, 0.1);
        border: 1px solid rgba(255, 255, 255, 0.2);
        border-radius: var(--radius-sm);
        padding: 8px 14px;
        font-size: 11px;
        color: rgba(255, 255, 255, 0.8);
        line-height: 1.5;
        text-align: right;
      }
      .experimental-badge strong {
        display: block;
        color: #fbbf24;
        font-weight: 700;
        letter-spacing: 0.06em;
        text-transform: uppercase;
        font-size: 10px;
      }
      /* On phones the badge would overlap the title: put it above it. */
      @media (max-width: 560px) {
        .experimental-badge {
          position: static;
          display: inline-block;
          margin: 14px 0 0 24px;
        }
        .header-inner {
          padding-top: 12px;
        }
      }

      /* ── Layout ─────────────────────────────────────────────────────── */
      .radar-main {
        max-width: 960px;
        margin: 0 auto;
        padding: 20px 24px 60px;
      }
      .filter-bar {
        display: flex;
        flex-direction: column;
        gap: 12px;
        margin-bottom: 16px;
      }
      .chip-row {
        display: flex;
        gap: 8px;
        overflow-x: auto;
        padding-bottom: 4px;
      }
      .chip,
      .toggle {
        flex-shrink: 0;
        font: inherit;
        font-size: 13px;
        font-weight: 600;
        color: var(--text-2);
        background: var(--surface);
        border: 1px solid var(--border);
        border-radius: 100px;
        padding: 7px 14px;
        cursor: pointer;
        transition:
          background 0.15s,
          color 0.15s,
          border-color 0.15s;
      }
      .chip:hover,
      .toggle:hover {
        border-color: var(--accent-2);
        color: var(--text);
      }
      .chip[aria-pressed='true'],
      .toggle[aria-pressed='true'] {
        background: var(--accent);
        border-color: var(--accent-2);
        color: var(--header-dark);
      }
      .filter-row {
        display: flex;
        flex-wrap: wrap;
        gap: 10px;
        align-items: center;
      }
      .filter-row select,
      .filter-row input {
        font: inherit;
        font-size: 14px;
        color: var(--text);
        background: var(--surface);
        border: 1px solid var(--border);
        border-radius: var(--radius-sm);
        padding: 8px 12px;
      }
      .filter-row input {
        flex: 1 1 200px;
        min-width: 160px;
      }
      .status-line,
      .notice-line {
        font-size: 13px;
        color: var(--text-2);
        min-height: 1.2em;
      }
      .notice-line {
        color: #fbbf24;
      }
      .map-panel {
        height: 340px;
        border-radius: var(--radius);
        overflow: hidden;
        border: 1px solid var(--border);
        margin-bottom: 24px;
        /* the map fills the panel above the "Hide map" row */
        display: flex;
        flex-direction: column;
      }
      #map {
        flex: 1;
        min-height: 0;
        width: 100%;
        background: var(--surface);
      }
      .map-panel .result-actions {
        padding: 8px 12px;
      }
      .leaflet-popup-content-wrapper,
      .leaflet-popup-tip {
        background: var(--surface);
        color: var(--text);
      }
      .pin-popup__item + .pin-popup__item {
        border-top: 1px solid var(--border);
        margin-top: 6px;
        padding-top: 6px;
      }
      .pin-popup__item div {
        font-size: 12px;
        color: var(--text-2);
      }

      /* ── Band cards ─────────────────────────────────────────────────── */
      .band-list {
        display: grid;
        gap: 14px;
        grid-template-columns: repeat(auto-fill, minmax(min(100%, 420px), 1fr));
        align-items: start;
      }
      .band-card {
        background: var(--surface);
        border: 1px solid var(--border);
        border-radius: var(--radius);
        overflow: hidden;
      }
      .band-card__summary {
        position: relative; /* anchors the member's follow button */
        list-style: none;
        cursor: pointer;
        padding: 16px 20px;
        display: grid;
        gap: 4px;
      }
      /* Members only: room on the right for the follow button. */
      #bandList.has-follow .band-card__summary {
        padding-right: 56px;
      }
      .band-card__summary::-webkit-details-marker {
        display: none;
      }
      .band-card__name {
        font-family: 'Fraunces', serif;
        font-size: 1.2rem;
        font-weight: 700;
        line-height: 1.25;
        overflow-wrap: anywhere;
      }
      .band-card__name::after {
        content: ' ▾';
        font-size: 0.8em;
      }
      .band-card[open] .band-card__name::after {
        content: ' ▴';
      }
      .band-card__count,
      .band-card__next {
        font-size: 13px;
        color: var(--text-2);
      }
      .band-card__next {
        font-weight: 600;
        color: var(--link);
      }
      .band-card__badge {
        justify-self: start;
        font-size: 11px;
        font-weight: 800;
        letter-spacing: 0.08em;
        padding: 2px 8px;
        background: var(--yellow);
        color: var(--ink);
        border: var(--stroke);
      }
      .band-show__new {
        margin-left: 8px;
        font-size: 10px;
        font-weight: 800;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        padding: 1px 6px;
        background: var(--yellow);
        color: var(--ink);
        border: 1px solid var(--ink);
      }
      .tracked-pane {
        margin: 0 0 18px;
        background: var(--surface);
        border: 1px solid var(--border);
        border-radius: var(--radius);
      }
      .tracked-pane > summary {
        cursor: pointer;
        padding: 12px 16px;
        font-weight: 700;
      }
      .tracked-list {
        list-style: none;
        margin: 0;
        padding: 0 16px 12px;
        columns: 2 260px;
        column-gap: 24px;
      }
      .tracked-band {
        break-inside: avoid;
        padding: 4px 0;
        font-size: 14px;
      }
      /* Members only: room on the right of each row for a smaller, fixed
         follow button (same idea as on the cards: nothing moves on a tap). */
      .has-follow > .tracked-band {
        position: relative;
        min-height: 32px;
        padding: 6px 40px 6px 0;
      }
      .has-follow > .tracked-band .follow-btn {
        top: 0;
        right: 0;
        width: 32px;
        height: 32px;
      }
      .tracked-band__count {
        margin-left: 8px;
        font-size: 12px;
        color: var(--text-2);
      }
      .tracked-note {
        padding: 0 16px 12px;
        font-size: 12px;
        color: var(--text-2);
      }
      .band-card__body {
        padding: 0 20px 16px;
        border-top: 1px solid var(--border);
      }
      .band-shows {
        list-style: none;
        margin: 12px 0;
        display: grid;
        gap: 12px;
      }
      .band-show__date {
        font-size: 13px;
        font-weight: 700;
        color: var(--link);
      }
      .band-show__place {
        font-size: 13px;
        color: var(--text-2);
        overflow-wrap: anywhere;
      }
      .band-show__distance {
        color: var(--link);
        font-weight: 600;
      }
      .band-show__link {
        font-size: 13px;
        font-weight: 600;
      }
      .filter-row input[type='date'] {
        min-width: 0;
      }
      .result-actions {
        display: flex;
        flex-wrap: wrap;
        gap: 14px;
        align-items: center;
        font-size: 13px;
        font-weight: 600;
      }
      .result-actions button {
        font: inherit;
        font-weight: 600;
        color: var(--link);
        background: none;
        border: none;
        padding: 0;
        cursor: pointer;
      }
      .empty-state,
      .error-state {
        color: var(--text-2);
        padding: 32px 0;
        text-align: center;
        font-size: 15px;
      }
      .error-state button {
        margin-left: 8px;
        font: inherit;
        font-weight: 600;
        color: var(--header-dark);
        background: var(--accent);
        border: none;
        border-radius: var(--radius-sm);
        padding: 6px 14px;
        cursor: pointer;
      }
      .member-bar[hidden],
      .suggest-pane[hidden] {
        display: none;
      }
      .member-bar__hello {
        font-weight: 600;
        margin-right: 8px;
      }
      /* Fixed box, out of the grid flow, with an SVG icon: following or
         not, in flight or not, the button never changes size or moves the
         text around it. */
      .follow-btn {
        position: absolute;
        top: 8px;
        right: 8px;
        width: 40px;
        height: 40px;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        border: 0;
        background: transparent;
        color: inherit;
        padding: 0;
        margin: 0;
        cursor: pointer;
      }
      .follow-btn svg {
        display: block;
        width: 20px;
        height: 20px;
        fill: none;
        stroke: currentColor;
        stroke-width: 2;
      }
      .follow-btn[aria-pressed='true'] {
        color: #c0392b;
      }
      .follow-btn[aria-pressed='true'] svg {
        fill: currentColor;
      }
      /* In flight: aria-disabled, not disabled (a click on a disabled button
         inside <summary> can toggle the card in some browsers). */
      .follow-btn[aria-disabled='true'] {
        opacity: 0.5;
        cursor: progress;
      }
      .suggest-form {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
        margin: 0;
        padding: 0 16px 12px;
      }
      .suggest-form input {
        flex: 1 1 180px;
      }
    </style>
    <link rel="stylesheet" href="theme.css" />
  </head>
  <body data-page="tours">
    <div class="ticker" aria-hidden="true">
      <div class="ticker__track">
        <span>Bands on the road</span><span>Tour dates, band by band</span
        ><span>New shows every week</span><span>Bands on the road</span
        ><span>Tour dates, band by band</span><span>New shows every week</span>
      </div>
    </div>
    <nav class="site-bar" aria-label="Tours">
      <a class="site-bar__logo" href="tours.html">Tokoro Tours</a>
    </nav>
    <header class="site-header">
      <div class="experimental-badge"><strong>⚠ Experimental</strong></div>
      <div class="header-inner">
        <h1 class="header-title">Tokoro <em>Tours</em></h1>
      </div>
    </header>

    <main class="radar-main">
      <section class="filter-bar" aria-label="Filters">
        <div class="filter-row">
          <input
            id="keywordFilter"
            type="search"
            placeholder="Search band, venue, place…"
            aria-label="Search bands and shows"
          />
          <input id="fromDate" type="date" aria-label="From date" />
          <input id="toDate" type="date" aria-label="To date" />
        </div>
        <div class="filter-row">
          <input
            id="placeInput"
            type="search"
            placeholder="Near a place…"
            enterkeyhint="search"
            aria-label="Near a place"
          />
          <select id="radiusFilter" aria-label="Radius">
            <option value="25">25 km</option>
            <option value="50">50 km</option>
            <option value="100" selected>100 km</option>
            <option value="250">250 km</option>
            <option value="500">500 km</option>
          </select>
          <button
            id="nearToggle"
            class="toggle"
            type="button"
            aria-pressed="false"
          >
            Near me
          </button>
        </div>
        <div class="filter-row">
          <button
            id="newOnlyToggle"
            class="toggle"
            type="button"
            aria-pressed="false"
          >
            New only
          </button>
          <button id="copyLinkBtn" class="toggle" type="button">
            🔗 Copy link
          </button>
        </div>
        <div class="filter-row member-bar" id="memberBar" hidden>
          <span class="member-bar__hello" id="memberHello"></span>
          <button
            id="allBandsBtn"
            class="toggle"
            type="button"
            aria-pressed="true"
          >
            All bands
          </button>
          <button
            id="myBandsBtn"
            class="toggle"
            type="button"
            aria-pressed="false"
          >
            My bands
          </button>
          <button id="telegramBtn" class="toggle" type="button">
            🔔 Telegram alerts
          </button>
          <a id="tripsLink" class="toggle" href="./trips.html">Plan a trip</a>
        </div>
        <p
          id="statusLine"
          class="status-line"
          role="status"
          aria-live="polite"
        ></p>
        <p
          id="noticeLine"
          class="notice-line"
          role="status"
          aria-live="polite"
        ></p>
        <p
          id="memberNote"
          class="notice-line"
          role="status"
          aria-live="polite"
          hidden
        ></p>
      </section>

      <details class="tracked-pane" id="trackedPane" hidden>
        <summary id="trackedSummary">Tracked bands</summary>
        <ul class="tracked-list" id="trackedList"></ul>
        <p class="tracked-note" id="trackedNote"></p>
      </details>

      <details class="tracked-pane suggest-pane" id="suggestPane" hidden>
        <summary>Suggest a band</summary>
        <form id="suggestForm" class="suggest-form">
          <input
            id="suggestName"
            type="text"
            maxlength="120"
            placeholder="Band name"
            aria-label="Band name"
            required
          />
          <input
            id="suggestUrl"
            type="url"
            maxlength="500"
            placeholder="Website (optional)"
            aria-label="Band website (optional)"
          />
          <button type="submit" class="toggle">Suggest</button>
        </form>
        <p
          id="suggestMsg"
          class="tracked-note"
          role="status"
          aria-live="polite"
        ></p>
        <ul id="suggestList" class="tracked-list"></ul>
      </details>

      <section class="map-panel" id="mapPanel" aria-label="Map of shows" hidden>
        <div id="map"></div>
        <div class="result-actions">
          <button type="button" id="hideMapBtn">Hide map</button>
        </div>
      </section>

      <section id="bandList" aria-label="Bands"></section>
    </main>

    <script
      src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
      integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo="
      crossorigin=""
    ></script>
    <script src="./shared.js"></script>
    <script src="./tours.js"></script>
    <script>
      (function () {
        'use strict';

        const API_URL = '__TOKORO_WORKER_URL__';
        const T = window.TokoroTours;
        // member.js is loaded on demand (loadMemberScript), so visitors never
        // download it. M stays null for visitors; it is only used once
        // member.ok is true or inside initMember after the load.
        let M = null;
        const MEMBER_SEED_KEY = 'tokoro_member'; // same key as member.js
        const storage = (() => {
          try {
            return window.localStorage;
          } catch (err) {
            return null; // private mode: member features stay off
          }
        })();
        // Member state. `ok` is true only after the server accepted the link.
        const member = {
          ok: false,
          api: null,
          name: '',
          followed: new Set(), // normalized band urls
          suggestions: [],
          mine: false, // show only followed bands
          syncing: false,
          inFlight: new Set(), // normalized band urls with a follow/unfollow request pending
        };
        let trackedDone = false; // load() has finished its tracked-bands attempt
        const today = formatLocalDateTime(new Date()).slice(0, 10);

        const state = {
          all: [],
          keyword: '',
          from: '',
          to: '',
          origin: null, // { lat, lng }
          originSource: '', // 'gps' | 'place' | ''
          place: '', // label of a typed place (saved in links)
          newOnly: false, // only shows first published in the last NEW_DAYS days
          radius: 100,
          open: new Set(), // band keys currently expanded
          mapBand: null, // band key shown on the map
          ready: false,
          tracked: null, // { generated, bands } from tracked-bands.json, or null
        };
        let keywordTimer = null;
        let geoReq = 0;
        let lastFitKey = null;

        const el = id => document.getElementById(id);

        function setStatus(text) {
          el('statusLine').textContent = text;
        }
        function setNotice(text) {
          el('noticeLine').textContent = text || '';
        }
        // The member note is hidden while empty, so visitors get no blank line.
        function setMemberNote(text) {
          el('memberNote').textContent = text || '';
          el('memberNote').hidden = !text;
        }

        // ── Filtering ───────────────────────────────────────────────────
        function visibleShows() {
          let list = T.filterShows(state.all, {
            keyword: state.keyword,
            from: state.from,
            to: state.to,
            origin: state.origin,
            radiusKm: state.origin ? state.radius : 0,
            newOnly: state.newOnly,
            nowMs: Date.now(),
          });
          if (member.ok && member.mine) {
            list = list.filter(s => M.isFollowed(member.followed, s.bandUrl));
          }
          if (state.origin) list = T.withDistance(list, state.origin);
          return list;
        }

        // ── Cards ───────────────────────────────────────────────────────
        function showHtml(s) {
          const url = safeUrl(s.url);
          const place = [s.venue, s.address].filter(Boolean).join(' · ');
          const distance =
            typeof s.distanceKm === 'number'
              ? ' <span class="band-show__distance">' +
                escHtml(T.fmtDistance(s.distanceKm)) +
                ' away</span>'
              : '';
          return (
            '<li class="band-show">' +
            '<div class="band-show__date">' +
            escHtml(T.fmtShowDate(s.start, s.time, today, s.end)) +
            (T.isNewShow(s, Date.now())
              ? '<span class="band-show__new">new</span>'
              : '') +
            '</div>' +
            '<div class="band-show__place">' +
            escHtml(place) +
            distance +
            '</div>' +
            (url
              ? '<a class="band-show__link" href="' +
                escHtml(url) +
                '" target="_blank" rel="noopener noreferrer">Show page ↗</a>'
              : '') +
            '</li>'
          );
        }

        // The follow button's attributes, shared by the first render and the
        // in-place updates so they cannot diverge. null = attribute absent.
        function followBtnAttrs(bandKey) {
          const on = M.isFollowed(member.followed, bandKey);
          const busy = member.inFlight.has(M.normalizeActUrl(bandKey));
          return {
            'aria-pressed': String(on),
            'aria-label': on ? 'Stop following this band' : 'Follow this band',
            title: on ? 'Following' : 'Follow this band',
            'aria-disabled': busy ? 'true' : null,
          };
        }
        // Outline heart; CSS fills it when aria-pressed is true.
        const FOLLOW_ICON =
          '<svg viewBox="0 0 24 24" aria-hidden="true" focusable="false">' +
          '<path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"/>' +
          '</svg>';

        function followBtnHtml(bandKey) {
          if (!member.ok) return '';
          const attrs = followBtnAttrs(bandKey);
          let html =
            '<button type="button" class="follow-btn" data-follow="' +
            escHtml(bandKey) +
            '"';
          for (const [name, value] of Object.entries(attrs)) {
            if (value !== null)
              html += ' ' + name + '="' + escHtml(value) + '"';
          }
          return html + '>' + FOLLOW_ICON + '</button>';
        }

        // Update every follow button (cards, tracked pane) in
        // place: no list rebuild, so nothing on the page moves.
        function syncFollowButtons() {
          if (!member.ok) return;
          for (const btn of document.querySelectorAll('[data-follow]')) {
            const attrs = followBtnAttrs(btn.getAttribute('data-follow'));
            for (const [name, value] of Object.entries(attrs)) {
              if (value === null) btn.removeAttribute(name);
              else btn.setAttribute(name, value);
            }
          }
        }

        function bandHtml(b) {
          const bandUrl = safeUrl(b.url);
          const n = b.shows.length;
          return (
            '<details class="band-card" data-key="' +
            escHtml(b.key) +
            '"' +
            (state.open.has(b.key) ? ' open' : '') +
            '>' +
            '<summary class="band-card__summary">' +
            '<span class="band-card__name">' +
            escHtml(b.name) +
            '</span>' +
            followBtnHtml(b.key) +
            (T.fmtNewBadge(b.newCount)
              ? '<span class="band-card__badge">' +
                escHtml(T.fmtNewBadge(b.newCount)) +
                '</span>'
              : '') +
            '<span class="band-card__count">' +
            n +
            (n === 1 ? ' upcoming show' : ' upcoming shows') +
            '</span>' +
            '<span class="band-card__next">' +
            escHtml(T.fmtNext(b, today)) +
            '</span>' +
            '</summary>' +
            '<div class="band-card__body">' +
            '<ul class="band-shows">' +
            b.shows.map(showHtml).join('') +
            '</ul>' +
            '<div class="result-actions">' +
            (bandUrl
              ? '<a href="' +
                escHtml(bandUrl) +
                '" target="_blank" rel="noopener noreferrer">Band website ↗</a>'
              : '') +
            (hasMap
              ? '<button type="button" data-show-on-map="' +
                escHtml(b.key) +
                '">Show on map</button>'
              : '') +
            '</div>' +
            '</div></details>'
          );
        }

        // A band row (tracked pane): the name linked to the
        // band's site, then `extra`, then the member's follow button.
        function bandRowHtml(name, rawUrl, extra) {
          const url = safeUrl(rawUrl);
          return (
            '<li class="tracked-band">' +
            (url
              ? '<a href="' +
                escHtml(url) +
                '" target="_blank" rel="noopener noreferrer">' +
                escHtml(name) +
                ' ↗</a>'
              : escHtml(name)) +
            (extra || '') +
            (url ? followBtnHtml(rawUrl) : '') +
            '</li>'
          );
        }

        function render() {
          if (!state.ready) return;
          const list = visibleShows();
          const bands = T.groupByBand(list, Date.now());
          const totalBands = T.groupByBand(state.all).length;

          el('bandList').classList.toggle('has-follow', member.ok);
          let cards;
          if (!state.all.length) {
            cards = '<p class="empty-state">No upcoming shows yet.</p>';
          } else if (bands.length) {
            cards =
              '<div class="band-list">' +
              bands.map(bandHtml).join('') +
              '</div>';
          } else if (member.ok && member.mine && member.followed.size === 0) {
            cards =
              '<p class="empty-state">You are not following any band yet. Switch to All bands and tap ♡ on a band.</p>';
          } else {
            cards = '<p class="empty-state">No shows match your filters.</p>';
          }
          el('bandList').innerHTML = cards;

          setStatus(
            state.all.length
              ? bands.length +
                  ' of ' +
                  totalBands +
                  ' bands · ' +
                  list.length +
                  (list.length === 1 ? ' show' : ' shows')
              : ''
          );
          renderPins(bands);
          syncFollowButtons(); // the tracked pane's hearts
        }

        // ── Map (optional: the list works without Leaflet) ─────────────
        const hasMap = typeof L !== 'undefined';
        let map = null;
        let pinLayer = null;

        function ensureMap() {
          if (map || !hasMap) return;
          map = L.map('map', {
            scrollWheelZoom: false,
            dragging: !L.Browser.mobile,
          }).setView([50, 12], 4);
          const tileOpts = {
            attribution:
              'Tiles &copy; Esri &mdash; Esri, HERE, Garmin, OpenStreetMap contributors',
            maxNativeZoom: 16,
            maxZoom: 18,
          };
          L.tileLayer(
            'https://server.arcgisonline.com/ArcGIS/rest/services/Canvas/World_Light_Gray_Base/MapServer/tile/{z}/{y}/{x}',
            tileOpts
          ).addTo(map);
          L.tileLayer(
            'https://server.arcgisonline.com/ArcGIS/rest/services/Canvas/World_Light_Gray_Reference/MapServer/tile/{z}/{y}/{x}',
            { ...tileOpts, attribution: '' }
          ).addTo(map);
          pinLayer = L.layerGroup().addTo(map);
        }

        function popupHtml(items) {
          return (
            '<div class="pin-popup">' +
            items
              .map(
                s =>
                  '<div class="pin-popup__item"><strong>' +
                  escHtml(s.bandName) +
                  '</strong><div>' +
                  escHtml(T.fmtShowDate(s.start, s.time, today, s.end)) +
                  '</div><div>' +
                  escHtml([s.venue, s.address].filter(Boolean).join(' · ')) +
                  '</div></div>'
              )
              .join('') +
            '</div>'
          );
        }

        function renderPins(bands) {
          if (!map || !state.mapBand) return;
          const band = bands.find(b => b.key === state.mapBand);
          pinLayer.clearLayers();
          if (!band) {
            el('mapPanel').hidden = true;
            state.mapBand = null;
            return;
          }
          const points = [];
          for (const pin of T.groupPins(band.shows)) {
            L.circleMarker([pin.lat, pin.lng], {
              radius: 9,
              fillColor: '#00d6b4',
              color: '#000000',
              weight: 3,
              opacity: 1,
              fillOpacity: 1,
            })
              .bindPopup(popupHtml(pin.items))
              .addTo(pinLayer);
            points.push([pin.lat, pin.lng]);
          }
          const fitKey = band.key + '|' + band.shows.map(s => s.id).join('|');
          if (points.length && fitKey !== lastFitKey) {
            lastFitKey = fitKey;
            map.fitBounds(T.fitPoints(points), {
              padding: [30, 30],
              maxZoom: 9,
            });
          }
        }

        function showBandOnMap(key) {
          if (!hasMap) return;
          state.mapBand = key;
          lastFitKey = null;
          el('mapPanel').hidden = false;
          ensureMap();
          map.invalidateSize();
          renderPins(T.groupByBand(visibleShows()));
          el('mapPanel').scrollIntoView({
            behavior: 'smooth',
            block: 'center',
          });
        }

        // ── Events ──────────────────────────────────────────────────────
        el('keywordFilter').addEventListener('input', e => {
          state.keyword = e.target.value;
          clearTimeout(keywordTimer);
          keywordTimer = setTimeout(render, 150);
        });
        // Mobile date pickers may fire only one of "input" / "change".
        for (const ev of ['input', 'change']) {
          el('fromDate').addEventListener(ev, e => {
            if (state.from === e.target.value) return;
            state.from = e.target.value;
            render();
          });
          el('toDate').addEventListener(ev, e => {
            if (state.to === e.target.value) return;
            state.to = e.target.value;
            render();
          });
        }
        el('radiusFilter').addEventListener('change', async e => {
          state.radius = Number(e.target.value) || 100;
          // a place typed but not yet looked up applies first
          await place.commit();
          if (!state.origin && !el('placeInput').value.trim())
            setNotice('Type a place or tap Near me to filter by distance.');
          render();
        });
        // <details> "toggle" does not bubble; capture it so open cards stay
        // open across re-renders.
        el('bandList').addEventListener(
          'toggle',
          e => {
            const card = e.target.closest
              ? e.target.closest('.band-card')
              : null;
            if (!card) return;
            const key = card.getAttribute('data-key');
            if (card.open) state.open.add(key);
            else state.open.delete(key);
          },
          true
        );
        el('bandList').addEventListener('click', e => {
          const btn = e.target.closest('[data-show-on-map]');
          if (btn) showBandOnMap(btn.getAttribute('data-show-on-map'));
        });
        el('hideMapBtn').addEventListener('click', () => {
          state.mapBand = null;
          el('mapPanel').hidden = true;
        });

        // ── Area: a place (geocoded) or "Near me" (geolocation) ────────
        function syncNearToggle() {
          el('nearToggle').setAttribute(
            'aria-pressed',
            String(state.originSource === 'gps')
          );
        }
        function clearOrigin() {
          state.origin = null;
          state.originSource = '';
          state.place = '';
          syncNearToggle();
        }
        const place = placeField(el('placeInput'), {
          clear() {
            geoReq++;
            if (state.originSource === 'place') clearOrigin();
            setNotice('');
            render();
          },
          apply: lookUpPlace,
        });
        async function lookUpPlace(text) {
          const req = ++geoReq;
          setNotice('Looking up ' + text + '…');
          try {
            const g = await geocode(text);
            if (req !== geoReq) return;
            state.origin = { lat: Number(g.lat), lng: Number(g.lng) };
            state.originSource = 'place';
            state.place = text;
            syncNearToggle();
            setNotice('');
          } catch (err) {
            if (req !== geoReq) return;
            setNotice('Could not find "' + text + '" — showing all shows.');
            if (state.originSource === 'place') clearOrigin();
          }
          render();
        }
        el('nearToggle').addEventListener('click', () => {
          if (state.originSource === 'gps') {
            clearOrigin();
            setNotice('');
            render();
            return;
          }
          if (!navigator.geolocation) {
            setNotice(
              'Location unavailable in this browser — showing all shows.'
            );
            return;
          }
          setNotice('Finding your location…');
          const req = ++geoReq;
          navigator.geolocation.getCurrentPosition(
            pos => {
              if (req !== geoReq) return;
              state.origin = {
                lat: pos.coords.latitude,
                lng: pos.coords.longitude,
              };
              state.originSource = 'gps';
              state.place = '';
              place.set('');
              syncNearToggle();
              setNotice('');
              render();
            },
            () => {
              if (req !== geoReq) return;
              setNotice('Location unavailable — showing all shows.');
            },
            { timeout: 10000, maximumAge: 600000 }
          );
        });

        // ── Tracked bands: which bands the crawler follows ─────────────
        async function fetchTracked() {
          try {
            const res = await fetch('./tracked-bands.json');
            if (!res.ok) return null;
            return T.parseTracked(await res.json());
          } catch (err) {
            return null; // missing or invalid: the pane falls back to the shows
          }
        }
        function renderTracked() {
          const rows = T.mergeTracked(
            state.tracked ? state.tracked.bands : [],
            state.all
          );
          const pane = el('trackedPane');
          if (!rows.length) {
            pane.hidden = true;
            return;
          }
          pane.hidden = false;
          el('trackedSummary').textContent =
            'Tracked bands (' + rows.length + ')';
          // Members get a heart on every row (bands without shows included).
          el('trackedList').classList.toggle('has-follow', member.ok);
          el('trackedList').innerHTML = rows
            .map(r => {
              const count = state.ready
                ? r.upcoming
                  ? r.upcoming +
                    (r.upcoming === 1 ? ' upcoming show' : ' upcoming shows')
                  : 'no upcoming shows'
                : '';
              return bandRowHtml(
                r.name,
                r.url,
                '<span class="tracked-band__count">' +
                  escHtml(count) +
                  '</span>'
              );
            })
            .join('');
          el('trackedNote').textContent =
            state.tracked && state.tracked.generated
              ? 'List updated ' + state.tracked.generated
              : '';
        }

        // ── Load ────────────────────────────────────────────────────────
        async function load() {
          state.ready = false;
          el('bandList').innerHTML = '';
          setNotice('');
          if (API_URL.indexOf('__TOKORO') === 0) {
            setStatus('');
            el('bandList').innerHTML =
              '<p class="error-state">The API address is not configured (the deploy step replaces the placeholder).</p>';
            return;
          }
          const trackedPromise = fetchTracked();
          setStatus('Loading tour dates…');
          try {
            const { events, truncated } = await T.loadTourEvents(
              window.fetch.bind(window),
              API_URL,
              T.tourWindow(today)
            );
            state.all = T.toShows(events, today);
            state.ready = true;
            state.tracked = await trackedPromise;
            renderTracked();
            render();
            trackedDone = true;
            syncMember();
            if (truncated)
              setNotice(
                'Showing the first results only — there are more shows than one page load.'
              );
          } catch (err) {
            state.tracked = await trackedPromise;
            renderTracked();
            trackedDone = true;
            syncMember();
            setStatus('');
            el('bandList').innerHTML =
              '<p class="error-state">Could not load tour dates right now. ' +
              '<button type="button" id="retryBtn">Try again</button></p>';
            el('retryBtn').addEventListener('click', load);
          }
        }

        // ── New only: shows first published in the last few days ──────
        function syncNewOnly() {
          el('newOnlyToggle').setAttribute(
            'aria-pressed',
            String(state.newOnly)
          );
        }
        el('newOnlyToggle').addEventListener('click', () => {
          state.newOnly = !state.newOnly;
          syncNewOnly();
          render();
        });

        // ── Saved queries: the filters live in the link ────────────────
        el('copyLinkBtn').addEventListener('click', async () => {
          const query = T.buildTourQuery({
            keyword: state.keyword,
            from: state.from,
            to: state.to,
            origin: state.origin,
            radius: state.radius,
            place: state.originSource === 'place' ? state.place : '',
            newOnly: state.newOnly,
          });
          const url =
            window.location.origin +
            window.location.pathname +
            (query ? '?' + query : '');
          const btn = el('copyLinkBtn');
          try {
            await navigator.clipboard.writeText(url);
            btn.textContent = '✓ Link copied';
            setTimeout(() => {
              btn.textContent = '🔗 Copy link';
            }, 2000);
          } catch (err) {
            window.prompt('Copy this link:', url);
          }
        });

        // Restore a saved query from the link (invalid values are ignored).
        (function restoreFromLink() {
          const saved = T.parseTourQuery(window.location.search);
          state.keyword = saved.keyword;
          state.from = saved.from;
          state.to = saved.to;
          state.radius = saved.radius;
          state.newOnly = saved.newOnly;
          syncNewOnly();
          el('keywordFilter').value = saved.keyword;
          el('fromDate').value = saved.from;
          el('toDate').value = saved.to;
          el('radiusFilter').value = String(saved.radius);
          if (saved.origin) {
            state.origin = saved.origin;
            state.originSource = 'place';
            state.place = saved.place;
            place.set(
              saved.place ||
                saved.origin.lat.toFixed(4) + ', ' + saved.origin.lng.toFixed(4)
            );
          }
        })();

        // ── Members: ♥ buttons, My bands, suggestions ──────────────────
        function renderSuggestions(views) {
          el('suggestList').innerHTML = views
            .map(v => {
              const label =
                v.state === 'added'
                  ? 'Added'
                  : v.state === 'rejected'
                    ? 'Not added' + (v.reason ? ' — ' + v.reason : '')
                    : 'Waiting';
              return (
                '<li class="tracked-band">' +
                escHtml(v.name) +
                '<span class="tracked-band__count">' +
                escHtml(label) +
                '</span></li>'
              );
            })
            .join('');
        }

        function currentViews() {
          return M.describeSuggestions(
            member.suggestions,
            state.tracked ? state.tracked.bands : []
          );
        }

        // Follow the tracked bands that match this member's pending
        // suggestions, once per device (so an unfollow sticks).
        async function syncMember() {
          if (!member.ok || !trackedDone || member.syncing) return;
          member.syncing = true;
          try {
            const done = M.loadAutoFollowed(storage);
            const views = currentViews();
            for (const v of views) {
              if (!v.autoFollowUrl || done.has(v.id)) continue;
              const key = M.normalizeActUrl(v.autoFollowUrl);
              if (key && !member.followed.has(key)) {
                member.followed.add(key);
                const res = await member.api
                  .follow(v.autoFollowUrl)
                  .catch(() => null);
                if (!res || !res.ok) {
                  member.followed.delete(key);
                  continue; // try again next visit
                }
              }
              done.add(v.id);
            }
            M.saveAutoFollowed(storage, done);
            renderSuggestions(views);
            render();
          } finally {
            member.syncing = false;
          }
        }

        function syncViewButtons() {
          el('allBandsBtn').setAttribute('aria-pressed', String(!member.mine));
          el('myBandsBtn').setAttribute('aria-pressed', String(member.mine));
        }
        function setMine(value) {
          if (!member.ok) return;
          member.mine = value;
          try {
            storage.setItem(M.MEMBER_VIEW_KEY, value ? 'mine' : 'all');
          } catch (err) {}
          syncViewButtons();
          render();
        }
        el('allBandsBtn').addEventListener('click', () => setMine(false));
        el('myBandsBtn').addEventListener('click', () => setMine(true));
        function syncTelegramButton(telegram) {
          el('telegramBtn').textContent =
            telegram && telegram.linked
              ? '🔔 Telegram alerts: on'
              : '🔔 Telegram alerts';
        }
        el('telegramBtn').addEventListener('click', async () => {
          if (!member.ok) return;
          const btn = el('telegramBtn');
          btn.disabled = true;
          let res;
          try {
            res = await member.api.telegramLinkCode();
          } catch (err) {
            res = null; // offline
          }
          btn.disabled = false;
          const url = res && res.ok && res.data && res.data.bot_url;
          if (typeof url !== 'string' || !/^https:\/\/t\.me\//.test(url)) {
            setMemberNote('Could not start Telegram alerts. Please try again.');
            return;
          }
          window.location.assign(url);
        });

        async function toggleFollow(bandUrl) {
          if (!member.ok) return;
          const key = M.normalizeActUrl(bandUrl);
          // One request per band at a time: clicks while one is pending are ignored.
          if (!key || member.inFlight.has(key)) return;
          const was = member.followed.has(key);
          if (was) member.followed.delete(key);
          else member.followed.add(key);
          member.inFlight.add(key);
          refreshFollowView();
          const res = await (
            was ? member.api.unfollow(bandUrl) : member.api.follow(bandUrl)
          ).catch(() => null);
          member.inFlight.delete(key);
          if (!res || !res.ok) {
            if (was) member.followed.add(key);
            else member.followed.delete(key);
            setMemberNote('Could not save that change. Please try again.');
          }
          refreshFollowView();
        }
        // All bands: a follow toggle only changes the buttons, so update them
        // in place. My bands: a card appears or disappears, so re-render (render() also syncs the tracked pane),
        // but keep the reader where they were.
        function refreshFollowView() {
          if (!member.mine) {
            syncFollowButtons();
            return;
          }
          const y = window.scrollY;
          render();
          window.scrollTo(0, y);
        }
        function onFollowClick(e) {
          const btn = e.target.closest('[data-follow]');
          if (!btn) return;
          e.preventDefault(); // on cards the button sits inside <summary>
          e.stopPropagation();
          toggleFollow(btn.getAttribute('data-follow'));
        }
        el('bandList').addEventListener('click', onFollowClick);
        el('trackedList').addEventListener('click', onFollowClick);

        el('suggestForm').addEventListener('submit', async e => {
          e.preventDefault();
          if (!member.ok) return;
          const name = el('suggestName').value.trim();
          const url = el('suggestUrl').value.trim();
          if (!name) return;
          const msg = el('suggestMsg');
          msg.textContent = 'Sending…';
          const res = await member.api.suggest(name, url).catch(() => null);
          if (!res || !res.ok) {
            msg.textContent =
              res && res.status === 400
                ? 'That does not look right. Check the name and the website.'
                : 'Could not send that. Please try again.';
            return;
          }
          el('suggestName').value = '';
          el('suggestUrl').value = '';
          msg.textContent = 'Thanks! We will take a look.';
          const again = await member.api.me().catch(() => null);
          if (again && again.ok)
            member.suggestions = again.data.suggestions || [];
          renderSuggestions(currentViews());
          await syncMember(); // a suggestion matching a tracked band is followed now
        });

        // Only a personal link or a stored seed makes the page fetch member.js.
        function loadMemberScript() {
          if (window.TokoroMember) return Promise.resolve(window.TokoroMember);
          return new Promise(resolve => {
            const script = document.createElement('script');
            script.src = './member.js';
            script.onload = () => resolve(window.TokoroMember || null);
            script.onerror = () => resolve(null);
            document.head.appendChild(script);
          });
        }

        async function initMember() {
          if (!storage) return; // private mode: visitor view
          const hash = window.location.hash;
          if (/^#k=[A-Za-z0-9_-]+$/.test(hash)) {
            // Never leave the link in the address bar or the history, even
            // if member.js then fails to load.
            history.replaceState(
              null,
              '',
              window.location.pathname + window.location.search
            );
          }
          let hasStored = false;
          try {
            hasStored = !!storage.getItem(MEMBER_SEED_KEY);
          } catch (err) {}
          if (!hash.startsWith('#k=') && !hasStored) return; // a visitor
          M = await loadMemberScript();
          if (!M) return; // no member.js: visitor view
          const res = await M.activateMember({
            hash,
            storage,
            fetchFn: window.fetch.bind(window),
            apiBase: API_URL,
          });
          if (!res.ok) {
            if (res.note) setMemberNote(res.note);
            return; // visitor view this time
          }
          member.api = res.api;
          member.ok = true;
          member.name = res.data.name || '';
          member.followed = M.followedSet(res.data.bands);
          member.suggestions = res.data.suggestions || [];
          member.mine = storage.getItem(M.MEMBER_VIEW_KEY) === 'mine';
          el('memberHello').textContent = member.name
            ? 'Hi, ' + member.name
            : 'Hi';
          el('memberBar').hidden = false;
          syncTelegramButton(res.data.telegram);
          el('suggestPane').hidden = false;
          syncViewButtons();
          renderSuggestions(currentViews());
          if (trackedDone) renderTracked(); // add the hearts (else load() will)
          render();
          await syncMember();
        }

        load();
        initMember();
      })();
    </script>
    <!-- build: __BUILD_VERSION__ -->
  </body>
</html>
